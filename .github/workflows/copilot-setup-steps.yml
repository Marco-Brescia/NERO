# Prepares the environment used by the Copilot cloud agent.
# The job name must stay exactly "copilot-setup-steps".
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep git
          rosdep update --rosdistro jazzy || true
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: Initial build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
